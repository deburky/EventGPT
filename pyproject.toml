[project]
name = "event-gpt"
version = "0.1.0"
description = "EventGPT: an open generative pretrained transformer for banking event sequences"
license = "Apache-2.0"
authors = [{ name = "Denis Burakov" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "catboost>=1.2.10",
    "duckdb>=1.5.1",
    "huggingface-hub>=1.6.0",
    "numpy>=1.26.4",
    "pandas>=2.3.3",
    "pyarrow>=23.0.1",
    "safetensors>=0.7.0",
    "scikit-learn>=1.7.2",
    "torch>=2.10.0",
]

[project.scripts]
egpt = "eventgpt.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "prek>=0.5.5",
    "pydocstyle[toml]>=6.3.0",
    "rust-just>=1.58.0",
    "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eventgpt"]

[tool.mypy]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 140
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "D"]
ignore = ["D100", "D105", "D107", "D203", "D213", "D405"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# Same docstring rules as ruff's D set above, for the standalone pydocstyle hook
[tool.pydocstyle]
convention = "google"
add_ignore = ["D100", "D105", "D107", "D405"]
match_dir = "^(?!\\.|_|tmp).*"
